<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>API Test</title>
</head>
<body>
  <h1>API 测试页面</h1>
  <pre id="result">测试中...</pre>
  <script>
    fetch('/api/uok/recommend', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({count: 3})
    })
    .then(r => {
      document.getElementById('result').textContent =
        `Status: ${r.status}\nHeaders: ${Array.from(r.headers.entries()).map(x => x[0]+': '+x[1]).join('\n')}\n\nBody: `;
      return r.text();
    })
    .then(body => {
      document.getElementById('result').textContent += body;
    })
    .catch(e => {
      document.getElementById('result').textContent = 'Error: ' + e.message;
    });
  </script>
</body>
</html>
